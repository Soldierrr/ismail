<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a href="#main" class="skip-link">Skip to content</a>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="brand">Ledger<span>.</span></a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="browse.html">Browse</a></li>
      <li><a href="upload.html">Sell your data</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html" class="active">Log in</a></li>
    </ul>
  </nav>
</header>

<main id="main">
  <section>
    <div class="wrap" style="max-width: 560px;">
      <div class="tabs">
        <button class="tab-btn active" data-tab="login-panel">Log in</button>
        <button class="tab-btn" data-tab="register-panel">Create account</button>
      </div>

      <div class="form-panel" style="max-width: none; padding: 32px;">

        <div class="tab-panel active" id="login-panel">
          <form data-auth-form="login" novalidate>
            <div class="field">
              <label for="login-email">Email address</label>
              <input type="email" id="login-email" required>
            </div>
            <div class="field">
              <label for="login-password">Password</label>
              <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log in</button>
          </form>
        </div>

        <div class="tab-panel" id="register-panel">
          <form data-auth-form="register" novalidate>
            <div class="field">
              <label for="reg-name">Full name</label>
              <input type="text" id="reg-name" required>
            </div>
            <div class="field">
              <label for="reg-email">Email address</label>
              <input type="email" id="reg-email" required>
            </div>
            <div class="field">
              <label for="reg-password">Password</label>
              <input type="password" id="reg-password" required>
              <div class="hint">Use at least 8 characters.</div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create account</button>
          </form>
        </div>

      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-grid">
      <a href="index.html" class="brand" style="font-size:1.2rem;">Ledger<span>.</span></a>
      <div class="footer-cols">
        <div class="footer-col">
          <h5>Explore</h5>
          <a href="browse.html">Browse datasets</a>
          <a href="upload.html">Sell your data</a>
        </div>
        <div class="footer-col">
          <h5>About</h5>
          <a href="about.html">The researcher</a>
          <a href="contact.html">Contact &amp; FAQ</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">© 2026 Ledger. Research data, sold directly by the people who collected it.</div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
