<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments — Ledger Admin</title>
<meta name="description" content="View all verified payments on the Ledger platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body-bg">

<div class="admin-shell">
  <div class="admin-mobile-bar">
    <a href="admin-dashboard.html" class="brand" style="font-size:1.1rem; color:var(--paper);">Ledger<span>.</span></a>
    <button class="admin-mobile-toggle" id="admin-sidebar-toggle" aria-label="Toggle sidebar">☰</button>
  </div>
  <div class="admin-sidebar-overlay" id="admin-overlay"></div>
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-sidebar-brand">
      <a href="admin-dashboard.html" class="brand admin-brand-link">Ledger<span>.</span></a>
      <span class="admin-badge-pill">Admin</span>
    </div>
    <nav class="admin-sidebar-nav">
      <a href="admin-dashboard.html" class="admin-nav-link">📊 Dashboard</a>
      <a href="admin-users.html"     class="admin-nav-link">👥 Users</a>
      <a href="admin-papers.html"    class="admin-nav-link">📄 Papers</a>
      <a href="admin-upload.html"    class="admin-nav-link">⬆ Upload</a>
      <a href="admin-payments.html"  class="admin-nav-link">💳 Payments</a>
      <a href="admin-tickets.html"   class="admin-nav-link">🎫 Support Tickets</a>
      <a href="admin-profile.html"   class="admin-nav-link">👤 My Profile</a>
    </nav>
    <div class="admin-sidebar-footer">
      <div class="admin-sidebar-user" id="sidebar-user-info"></div>
      <button id="admin-logout-btn" class="admin-logout-btn">⏻ Log out</button>
    </div>
  </aside>

  <div class="admin-content">
    <div class="admin-page-header">
      <p class="eyebrow" style="margin-bottom:4px;">Records</p>
      <h1>Payments</h1>
    </div>
    <div class="admin-body">
      <p style="color:var(--ink-soft); margin-bottom:24px; font-size:0.95rem;">All payment records on the platform. Verified payments are shown for audit and record-keeping purposes.</p>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>User Name</th>
              <th>Email</th>
              <th>Dataset</th>
              <th>Amount (NGN)</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="admin-payments-tbody">
            <tr><td colspan="6" style="text-align:center;padding:24px;color:var(--ink-soft);">Loading payments…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
