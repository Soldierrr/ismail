<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta name="theme-color" content="#16292B">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — Research Hub Admin</title>
<meta name="description" content="Manage registered users and admin roles on Research Hub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body-bg">

<div class="admin-shell">
  <div class="admin-mobile-bar">
    <a href="admin-dashboard.html" class="brand" style="font-size:1.1rem; color:var(--paper);">Research Hub</a>
    <button class="admin-mobile-toggle" id="admin-sidebar-toggle" aria-label="Toggle sidebar">☰</button>
  </div>
  <div class="admin-sidebar-overlay" id="admin-overlay"></div>
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-sidebar-brand">
      <a href="admin-dashboard.html" class="brand admin-brand-link">Research Hub</a>
      <span class="admin-badge-pill">Admin</span>
    </div>
    <nav class="admin-sidebar-nav">
      <a href="admin-dashboard.html" class="admin-nav-link">📊 Dashboard</a>
      <a href="admin-users.html"     class="admin-nav-link">👥 Users</a>
      <a href="admin-papers.html"    class="admin-nav-link">📄 Papers</a>
      <a href="admin-upload.html"    class="admin-nav-link">⬆ Upload</a>
      <a href="admin-payments.html"  class="admin-nav-link">💳 Payments</a>
      <a href="admin-tickets.html"   class="admin-nav-link">🎫 Support Tickets</a>
      <a href="admin-profile.html"   class="admin-nav-link">👤 My Profile</a>
    </nav>
    <div class="admin-sidebar-footer">
      <div class="admin-sidebar-user" id="sidebar-user-info"></div>
      <button id="admin-logout-btn" class="admin-logout-btn">⏻ Log out</button>
    </div>
  </aside>

  <div class="admin-content">
    <div class="admin-page-header">
      <p class="eyebrow" style="margin-bottom:4px;">Manage</p>
      <h1>Users</h1>
    </div>
    <div class="admin-body">
      <p style="color:var(--ink-soft); margin-bottom:24px; font-size:0.95rem;">Promote or revoke administrator privileges for any registered user. The default admin account is protected.</p>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Joined</th>
              <th>Role</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="admin-users-tbody">
            <tr><td colspan="5" style="text-align:center;padding:24px;color:var(--ink-soft);">Loading users…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/script.js"></script>
<script type="module" src="/animations.js"></script>
</body>
</html>
