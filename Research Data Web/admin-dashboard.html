<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta name="theme-color" content="#16292B">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Ledger Admin</title>
<meta name="description" content="Ledger administrator dashboard — overview statistics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body-bg">

<div class="admin-shell">

  <!-- Mobile top bar -->
  <div class="admin-mobile-bar">
    <a href="admin-dashboard.html" class="brand" style="font-size:1.1rem; color:var(--paper);">Ledger<span>.</span></a>
    <button class="admin-mobile-toggle" id="admin-sidebar-toggle" aria-label="Toggle sidebar">☰</button>
  </div>
  <div class="admin-sidebar-overlay" id="admin-overlay"></div>

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-sidebar-brand">
      <a href="admin-dashboard.html" class="brand admin-brand-link">Ledger<span>.</span></a>
      <span class="admin-badge-pill">Admin</span>
    </div>
    <nav class="admin-sidebar-nav">
      <a href="admin-dashboard.html" class="admin-nav-link">📊 Dashboard</a>
      <a href="admin-users.html"     class="admin-nav-link">👥 Users</a>
      <a href="admin-papers.html"    class="admin-nav-link">📄 Papers</a>
      <a href="admin-upload.html"    class="admin-nav-link">⬆ Upload</a>
      <a href="admin-payments.html"  class="admin-nav-link">💳 Payments</a>
      <a href="admin-tickets.html"   class="admin-nav-link">🎫 Support Tickets</a>
      <a href="admin-profile.html"   class="admin-nav-link">👤 My Profile</a>
    </nav>
    <div class="admin-sidebar-footer">
      <div class="admin-sidebar-user" id="sidebar-user-info"></div>
      <button id="admin-logout-btn" class="admin-logout-btn">⏻ Log out</button>
    </div>
  </aside>

  <!-- Main content -->
  <div class="admin-content">
    <div class="admin-page-header">
      <p class="eyebrow" style="margin-bottom:4px;">Overview</p>
      <h1>Dashboard</h1>
    </div>

    <div class="admin-body" id="admin-dash-stats">

      <!-- Stat cards -->
      <div class="admin-stat-grid">
        <div class="admin-stat-card">
          <div class="admin-stat-icon">📄</div>
          <div class="admin-stat-num" id="stat-papers">0</div>
          <div class="admin-stat-label">Total Papers</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-icon">⬇</div>
          <div class="admin-stat-num" id="stat-downloads">0</div>
          <div class="admin-stat-label">Total Downloads</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-icon">₦</div>
          <div class="admin-stat-num" id="stat-revenue">₦0</div>
          <div class="admin-stat-label">Total Revenue</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-icon">👥</div>
          <div class="admin-stat-num" id="stat-users">0</div>
          <div class="admin-stat-label">Registered Users</div>
        </div>
      </div>

      <!-- Recent activity -->
      <div class="admin-panel" style="margin-top: 32px;">
        <h2 style="font-size:1.1rem; margin-bottom:16px;">Recent Activity</h2>
        <div id="admin-recent-activity"></div>
      </div>

    </div>
  </div>
</div>

<script src="script.js"></script>
<script src="animations.js"></script>
</body>
</html>
